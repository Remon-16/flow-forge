appId: com.flow-forge.case-editor
productName: Flow Forge Case Editor
directories:
  buildResources: build
  output: dist-electron
files:
  - dist
  - dist-electron
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
