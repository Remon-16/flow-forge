case_type: biz
sheet_name: 状态不合规操作验证
api_name: 订单状态不合规操作（已支付订单取消/收货均返回 204002）
steps:
  - step_id: Step_LoginBuyer
    relevance_id: IF_AUTH_LOGIN
    api_name: 买家登录
    app_name: foliMail
    method: POST
    url: /api/auth/login
    request_head:
      Content-Type: application/json
    request_body:
      username: buyer01
      password: buyer123
    status_code: 200
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data.token is_not_null

  - step_id: Step_PreparePaidOrder
    relevance_id: IF_AUTH_ME
    api_name: 造一条已支付订单
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    preprocessors:
      - name: order-fixture
        config:
          order_status: 1
          order_id: 9000000000000000040
    assert_dict:
      code: '100000'

  - step_id: Step_CancelPaid
    relevance_id: IF_ORDER_CANCEL
    api_name: 取消已支付订单
    app_name: foliMail
    method: PUT
    url: /api/orders/9000000000000000040/cancel
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      code: '204002'

  - step_id: Step_ReceivePaid
    relevance_id: IF_ORDER_RECEIVE
    api_name: 对已支付订单确认收货
    app_name: foliMail
    method: PUT
    url: /api/orders/9000000000000000040/receive
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      code: '204002'
