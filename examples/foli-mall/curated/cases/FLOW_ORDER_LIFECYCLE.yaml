case_type: biz
sheet_name: 订单生命周期操作验证
api_name: 订单生命周期（下单→发货→收货→完成）
steps:
  - step_id: Step_LoginBuyer
    relevance_id: IF_AUTH_LOGIN
    api_name: 买家登录
    app_name: foliMail
    method: POST
    url: /api/auth/login
    request_head:
      Content-Type: application/json
    request_body:
      username: buyer01
      password: buyer123
    status_code: 200
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data.token is_not_null

  - step_id: Step_EnsureCart
    relevance_id: IF_CART_LIST
    api_name: 确保购物车有选中项
    app_name: foliMail
    method: GET
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    preprocessors:
      - name: cart-fixture
        config:
          mode: ensure
          product_id: 1000000000000003001
          quantity: 1
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data.length() >= 1

  - step_id: Step_CreateOrder
    relevance_id: IF_ORDER_CREATE
    api_name: 创建订单
    app_name: foliMail
    method: POST
    url: /api/orders
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body:
      receiverName: 张三
      receiverPhone: "13800001111"
      receiverAddress: 北京市朝阳区
    status_code: 200
    preprocessors:
      - name: balance-fixture
        config:
          balance: 10000
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data[0].id is_not_null
      - $.data[0].status == 1

  - step_id: Step_LoginSeller
    relevance_id: IF_AUTH_LOGIN
    api_name: 卖家登录
    app_name: foliMail
    method: POST
    url: /api/auth/login
    request_head:
      Content-Type: application/json
    request_body:
      username: seller01
      password: seller123
    status_code: 200
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data.token is_not_null

  - step_id: Step_Ship
    relevance_id: IF_SELLER_ORDER_SHIP
    api_name: 卖家发货
    app_name: foliMail
    method: PUT
    url: /api/seller/orders/#{orderId}/ship
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{seller01}"
    request_body: {}
    status_code: 200
    inherit:
      orderId: Step_CreateOrder.data[0].id
    assert_dict:
      code: '100000'

  - step_id: Step_Receive
    relevance_id: IF_ORDER_RECEIVE
    api_name: 买家确认收货
    app_name: foliMail
    method: PUT
    url: /api/orders/#{orderId}/receive
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    inherit:
      orderId: Step_CreateOrder.data[0].id
    assert_dict:
      code: '100000'

  - step_id: Step_Verify
    relevance_id: IF_ORDER_DETAIL
    api_name: 校验订单已完成
    app_name: foliMail
    method: GET
    url: /api/orders/#{orderId}
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    inherit:
      orderId: Step_CreateOrder.data[0].id
    assert_dict:
      code: '100000'
    assert_rules:
      - $.data.status == 4
