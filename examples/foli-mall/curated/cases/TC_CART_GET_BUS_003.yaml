case_type: single
test_id: TC_CART_GET_BUS_003
relevance_id: api_api_cart_get
tag: P2
api_name: 获取购物车列表（商品已删除，边界）
app_name: foliMail
method: GET
url: /api/cart
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer02}"
request_body: {}
status_code: 200
preprocessors:
  - name: cart-fixture
    config:
      mode: add
      product_id: 1000000000000003001
      quantity: 1
      cart_item_id: 9000000000000000021
  - name: product-fixture
    config:
      mode: set_deleted
      product_id: 1000000000000003001
      cleanup: true
postprocessors:
  - name: product-fixture
    config:
      cleanup: true
assert_dict:
  code: '100000'
assert_rules:
  - $.data[0].productName is_null
remark: 修正：商品逻辑删除后购物车列表仍返回 100000，商品信息字段为 null（非 203001）。
