case_type: single
test_id: TC_CART_LIST_004
relevance_id: IF_CART_LIST
api_name: 获取购物车列表-商品已逻辑删除
app_name: foliMail
method: GET
url: /api/cart
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer02}"
request_body: {}
status_code: 200
preprocessors:
  - name: cart-fixture
    config:
      mode: add
      product_id: 1000000000000003001
      quantity: 1
      cart_item_id: 9000000000000000101
  - name: product-fixture
    config:
      mode: set_deleted
      product_id: 1000000000000003001
      cleanup: true
postprocessors:
  - name: product-fixture
    config:
      cleanup: true
assert_dict:
  $.code: "100000"
assert_rules:
  - "$.data[0].productName is_null"
tag: P2
remark: 商品逻辑删除后购物车列表仍返回 100000，商品信息字段为 null
