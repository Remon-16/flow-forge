case_type: single
test_id: TC_ORDER_CREATE_001
relevance_id: IF_ORDER_CREATE
api_name: 创建订单-单店铺正常下单
app_name: foliMail
method: POST
url: /api/orders
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer01}"
request_body:
  receiverName: 张三
  receiverPhone: "13800001111"
  receiverAddress: 北京市朝阳区
status_code: 200
preprocessors:
  - name: cart-fixture
    config:
      mode: clear
  - name: balance-fixture
    config:
      balance: 10000
  - name: cart-fixture
    config:
      mode: ensure
      product_id: 1000000000000003001
      quantity: 1
assert_dict:
  $.code: "100000"
assert_rules:
  - "$.data.length() == 1"
  - "$.data[0].status == 1"
  - "$.data[0].orderNo =~ ^FO\\d{14}$"
  - "$.data[0].payTime is_not_null"
tag: P0
remark: 一体化下单即 PAID(1)，订单号符合 FO+yyyyMMdd+6位数字，payTime 已记录
