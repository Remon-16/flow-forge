case_type: single
test_id: TC_ORDER_CREATE_006
relevance_id: IF_ORDER_CREATE
api_name: 创建订单-库存不足
app_name: foliMail
method: POST
url: /api/orders
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer01}"
request_body:
  receiverName: 张三
  receiverPhone: "13800001111"
  receiverAddress: 北京市朝阳区
status_code: 200
preprocessors:
  - name: cart-fixture
    config:
      mode: clear
  - name: balance-fixture
    config:
      balance: 10000
  - name: cart-fixture
    config:
      mode: add
      product_id: 1000000000000003001
      quantity: 100
      cart_item_id: 9000000000000000109
  - name: product-fixture
    config:
      mode: set_stock
      stock: 50
      product_id: 1000000000000003001
      cleanup: true
postprocessors:
  - name: product-fixture
    config:
      cleanup: true
assert_dict:
  $.code: "203002"
tag: P1
remark: 购物车数量超过库存，下单应返回 203002
