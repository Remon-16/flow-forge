case_type: single
test_id: TC_CART_LIST_001
relevance_id: IF_CART_LIST
api_name: 获取购物车列表-有选中项
app_name: foliMail
method: GET
url: /api/cart
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer01}"
request_body: {}
status_code: 200
preprocessors:
  - name: cart-fixture
    config:
      mode: ensure
      product_id: 1000000000000003001
      quantity: 1
assert_dict:
  $.code: "100000"
assert_rules:
  - "$.data.length() >= 1"
  - "$.data[0].productId is_not_null"
  - "$.data[0].selected == 1"
tag: P0
remark: 已登录买家可查看购物车列表且默认选中
