case_type: single
test_id: TC_ORDER_LIST_002
relevance_id: IF_ORDER_LIST
api_name: 买家订单列表-按状态过滤
app_name: foliMail
method: GET
url: /api/orders?status=5&page=1&pageSize=10
request_head:
  Content-Type: application/json
  Authorization: "Bearer #{buyer01}"
request_body: {}
status_code: 200
preprocessors:
  - name: order-fixture
    config:
      order_status: 5
      order_id: 9000000000000000202
assert_dict:
  $.code: "100000"
assert_rules:
  - "$.data.total >= 1"
  - "$.data.records[0].status == 5"
tag: P1
remark: 按 status=5 过滤应返回已取消订单
