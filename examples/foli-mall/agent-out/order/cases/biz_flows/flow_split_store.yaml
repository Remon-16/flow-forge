case_type: biz
sheet_name: 多店铺购物车下单拆单
steps:
  - step_id: Step01
    relevance_id: IF_CART_CLEAR
    api_name: 清空购物车
    app_name: foliMail
    method: DELETE
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step02
    relevance_id: IF_CART_ADD
    api_name: 添加店铺1商品
    app_name: foliMail
    method: POST
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body:
      productId: 1000000000000003001
      quantity: 1
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step03
    relevance_id: IF_CART_ADD
    api_name: 添加店铺2商品
    app_name: foliMail
    method: POST
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body:
      productId: 1000000000000003013
      quantity: 1
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step04
    relevance_id: IF_ORDER_CREATE
    api_name: 创建订单验证按店铺拆单
    app_name: foliMail
    method: POST
    url: /api/orders
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body:
      receiverName: 李四
      receiverPhone: "13800002222"
      receiverAddress: 北京市朝阳区
    status_code: 200
    preprocessors:
      - name: balance-fixture
        config:
          balance: 10000
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.length() == 2"
      - "$.data[0].status == 1"
      - "$.data[1].status == 1"
      - "$.data[0].storeId is_not_null"
  - step_id: Step05
    relevance_id: IF_CART_LIST
    api_name: 校验选中购物车项已清空
    app_name: foliMail
    method: GET
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.length() == 0"
  - step_id: Step06
    relevance_id: IF_AUTH_ME
    api_name: 校验余额一次性扣减
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer02}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.balance >= 0"
      - "$.data.balance < 10000"
