case_type: biz
sheet_name: 加购去重并下单校验
steps:
  - step_id: Step01
    relevance_id: IF_CART_CLEAR
    api_name: 清空购物车
    app_name: foliMail
    method: DELETE
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step02
    relevance_id: IF_CART_ADD
    api_name: 添加商品到购物车
    app_name: foliMail
    method: POST
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body:
      productId: 1000000000000003001
      quantity: 1
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step03
    relevance_id: IF_CART_ADD
    api_name: 再次添加同一商品（去重累加）
    app_name: foliMail
    method: POST
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body:
      productId: 1000000000000003001
      quantity: 1
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step04
    relevance_id: IF_CART_LIST
    api_name: 查询购物车验证数量累加
    app_name: foliMail
    method: GET
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.length() == 1"
      - "$.data[0].quantity == 2"
      - "$.data[0].selected == 1"
  - step_id: Step05
    relevance_id: IF_ORDER_CREATE
    api_name: 创建订单（一体化支付）
    app_name: foliMail
    method: POST
    url: /api/orders
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body:
      receiverName: 张三
      receiverPhone: "13800001111"
      receiverAddress: 北京市朝阳区
    status_code: 200
    preprocessors:
      - name: balance-fixture
        config:
          balance: 10000
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.length() == 1"
      - "$.data[0].status == 1"
      - "$.data[0].orderNo =~ ^FO\\d{14}$"
    inherit:
      orderId: Step05.data[0].id
  - step_id: Step06
    relevance_id: IF_ORDER_DETAIL
    api_name: 查询订单详情
    app_name: foliMail
    method: GET
    url: /api/orders/#{orderId}
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    inherit:
      orderId: Step05.data[0].id
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.status == 1"
      - "$.data.totalAmount > 0"
  - step_id: Step07
    relevance_id: IF_AUTH_ME
    api_name: 校验余额已扣减
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.balance >= 0"
      - "$.data.balance < 10000"
  - step_id: Step08
    relevance_id: IF_CART_LIST
    api_name: 校验选中购物车项已清空
    app_name: foliMail
    method: GET
    url: /api/cart
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.length() == 0"
