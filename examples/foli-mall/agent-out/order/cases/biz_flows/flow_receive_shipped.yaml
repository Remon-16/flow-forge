case_type: biz
sheet_name: 已发货订单确认收货
steps:
  - step_id: Step01
    relevance_id: IF_AUTH_ME
    api_name: 造一条已发货订单
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    preprocessors:
      - name: order-fixture
        config:
          order_status: 2
          order_id: 9000000000000000403
    assert_dict:
      $.code: "100000"
  - step_id: Step02
    relevance_id: IF_ORDER_RECEIVE
    api_name: 确认收货
    app_name: foliMail
    method: PUT
    url: /api/orders/9000000000000000403/receive
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step03
    relevance_id: IF_ORDER_DETAIL
    api_name: 校验订单已完成
    app_name: foliMail
    method: GET
    url: /api/orders/9000000000000000403
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.status == 4"
      - "$.data.receiveTime is_not_null"
