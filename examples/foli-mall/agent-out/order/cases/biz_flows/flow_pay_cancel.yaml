case_type: biz
sheet_name: 待支付订单支付与取消
steps:
  - step_id: Step01
    relevance_id: IF_AUTH_ME
    api_name: 造一条待支付订单
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    preprocessors:
      - name: order-fixture
        config:
          order_status: 0
          order_id: 9000000000000000401
      - name: balance-fixture
        config:
          balance: 10000
    assert_dict:
      $.code: "100000"
  - step_id: Step02
    relevance_id: IF_ORDER_PAY
    api_name: 支付待支付订单
    app_name: foliMail
    method: PUT
    url: /api/orders/9000000000000000401/pay
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step03
    relevance_id: IF_AUTH_ME
    api_name: 校验支付已扣余额
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.balance >= 0"
      - "$.data.balance < 10000"
  - step_id: Step04
    relevance_id: IF_AUTH_ME
    api_name: 再造一条待支付订单
    app_name: foliMail
    method: GET
    url: /api/auth/me
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    preprocessors:
      - name: order-fixture
        config:
          order_status: 0
          order_id: 9000000000000000402
      - name: balance-fixture
        config:
          balance: 10000
    assert_dict:
      $.code: "100000"
  - step_id: Step05
    relevance_id: IF_ORDER_CANCEL
    api_name: 取消待支付订单
    app_name: foliMail
    method: PUT
    url: /api/orders/9000000000000000402/cancel
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
  - step_id: Step06
    relevance_id: IF_ORDER_DETAIL
    api_name: 校验取消后订单状态
    app_name: foliMail
    method: GET
    url: /api/orders/9000000000000000402
    request_head:
      Content-Type: application/json
      Authorization: "Bearer #{buyer01}"
    request_body: {}
    status_code: 200
    assert_dict:
      $.code: "100000"
    assert_rules:
      - "$.data.status == 5"
