# ================================================================
# Flow Forge — 配置文件 (Configuration File)
# ================================================================
# 复制此文件为 env.yaml 并修改配置：
#   cp env.example.yaml env.yaml
# Copy to env.yaml and edit:
#   cp env.example.yaml env.yaml
# ================================================================

# --- LLM 供应商配置 / LLM Provider Configuration ---
llm:
  # 供应商 / Provider: openai
  provider: openai

  # API 密钥（必填） / API key (required)
  api_key: sk-your-api-key-here

  # 模型名称 / Model name
  model: gpt-4o

  # 生成温度（0.0~2.0） / Generation temperature
  temperature: 0.3

  # 单次最大输出 token / Max output tokens per call
  max_output_tokens: 4096

  # 上下文窗口大小 / Context window size (tokens)
  context_window: 128000

  # 上下文压缩阈值 / Context compression threshold
  # 推理模型建议 0.95，小窗口模型建议 0.8
  # Use 0.95 for reasoning models, 0.8 for small-window models
  context_compression_threshold: 0.9

  # API Base URL（OpenAI 留空；DeepSeek: https://api.deepseek.com）
  # Leave empty for OpenAI; set for third-party providers
  base_url: ""

  # 最大并发请求数（0=无限制） / Max concurrent requests (0=unlimited)
  max_concurrency: 1

  # 请求间隔秒数 / Min seconds between requests
  rate_limit_delay: 0.0

  # 重试基础延迟秒数 / Retry base delay (seconds)
  retry_base_delay: 2.0

  # HTTP 请求超时秒数（连接 + 读取） / Request timeout (connect + read)
  request_timeout: 600.0

  # 额外参数（直接传递给 API） / Extra params passed directly to chat.completions.create
  # 用于开启思考模式等厂商特定功能 / For vendor-specific features like thinking mode
  # 示例 / Examples:
  #   # DeepSeek 思考模式 / DeepSeek thinking mode:
  #   extra_params:
  #     reasoning_effort: "high"
  #     extra_body: {"thinking": {"type": "enabled"}}
  #   # OpenAI o-series 推理强度 / OpenAI o-series reasoning effort:
  #   extra_params:
  #     reasoning_effort: medium
  extra_params: {}

# --- 流水线设置 / Pipeline Settings ---
pipeline:
  # 最大智能体步数 / Max agent steps
  max_steps: 10

  # LLM 调用最大重试次数 / Max LLM call retries
  max_retries: 3

  # 连续批次失败上限（-1=永不停止） / Consecutive batch failure limit (-1=never)
  consecutive_batch_failure_limit: 3

  # 骨架生成分批大小（每个批次包含的测试点数量）/ Skeleton batch size (test points per batch)
  skeleton_batch_size: 30

  # 单接口测试点分组大小（-1=不拆分，强模型建议 -1）/ Single API batch size (-1=no split)
  plan_single_batch_size: 8

  # 用例生成类型 / Case generation type: both (默认) | single (仅单接口) | biz (仅业务链路)
  case_type: both

  # 插件处理批次大小（-1=不分批）/ Plugin batch size (-1=no split)
  plugin_batch_size: 10

  # 自动模式：自动通过接口分析和计划审核，无需人工介入
  # Auto mode: auto-pass API analysis and plan review without human intervention
  auto: false

# --- 校验与纠错 / Validation & Correction ---
validation:
  # ··· URL 文档匹配校验 / URL doc-match validation ···
  # 校验接口 URL 是否真实存在于 API 文档原文中，未命中时 LLM 自动纠错
  # Validates interface URLs against the API doc text; auto-corrects mismatches via LLM
  url_doc_match_validation:
    enable: true                        # 启用 URL 文档匹配校验 / Enable URL doc-match validation
    max_retries: 3                      # URL 纠错重试次数 / URL correction retry limit
    rules:
      - check: url_check                # URL 存在性校验 / URL existence check
        strategy: warn                  # 纠错耗尽后策略 / Strategy: fail（终止）| warn（警告继续）| skip（跳过）

  # ··· 用例生成阶段校验 / Case generation validation ···
  # 作用于 skeleton/data_fill/assertion 等生成步骤，与文档解析阶段的校验区分
  # Governs count validation and URL checks during generation stages (vs doc parsing stage)
  # 策略值 / Strategy: fail（终止并重试/abort and retry）| warn（警告继续/warn and continue）| skip（跳过/skip）
  case_gen_validation:
    enable: true                        # 启用用例格式校验 / Enable case format validation（原 case_format_enabled）
    max_retries: 3                      # 用例格式校验重试次数 / Case format validation retry limit（原 case_format_max_retries）
    rules:
      - check: skeleton_count
        strategy: warn
      - check: url_check
        strategy: warn
        failure_action: discard         # 失败后处理 / Failure action: discard（丢弃） | keep（保留并继续插件处理）
      - check: data_fill_count
        strategy: warn
      - check: assertion_count
        strategy: warn
      - check: processor_count
        strategy: warn

  # ··· 计划解析校验 / Parse plan validation ···
  # 校验 LLM 输出的测试流程是否与需求文档中定义的流程正确关联
  # Validates whether LLM-generated test flows are correctly associated with requirements
  parse_plan_validation:
    enable: true                        # 启用计划解析校验 / Enable parse plan validation
    max_retries: 3                      # 校验失败重试次数 / Validation retry limit
    rules:
      - check: flow_match               # 流程关联校验 / Flow association check
        strategy: warn                  # fail（终止）| warn（警告继续）| skip（跳过）
        failure_action: discard         # 失败后处理 / Failure action: discard（丢弃）| keep（保留）

# --- 输出设置 / Output Settings ---
output:
  # 输出根目录 / Output root directory
  dir: ./output

  # 输出格式: yaml | excel | both
  format: both

# --- 插件系统 / Plugin System ---
plugins:
  # 启用插件 / Enable plugins
  enabled: true

  # 插件模块路径列表（按声明顺序执行） / Plugin module paths (executed in order)
  modules:
    - plugins.official.data_filling.DataFillingPlugin
    - plugins.official.processor_plugin.ProcessorPlugin
    - plugins.official.assertion_generation.AssertionGenerationPlugin

# --- Skill 系统 / Skill System ---
# Skill 是插件的附属配置，为 Agent 注入领域知识。
# 设为 false 后插件仍正常运行，只是不加载 Skill 提供的额外提示词。
# Skills are plugin-attached configs that inject domain knowledge into agents.
# Set to false to run plugins without any skill-injected prompt extensions.
skills:
  # 启用 Skill 注入 / Enable skill injection
  enabled: true

  # 按目标 Agent 分配 Skill 文件（不含 .yaml 扩展名） / Assign skill files to agents
  agents:
    # 插件 Agent（Plugin agents）
    data_filler:
      - foli_mall_data_filling
    processor_selector:
      - db_processors
      # - redis_processors    # 启用 Redis 处理器 / Enable Redis processors
      # - mq_processors       # 启用 MQ 处理器（Kombu: RabbitMQ/Redis/SQS/MongoDB） / Enable MQ processors
      # - rocketmq_processors # 启用 RocketMQ 处理器 / Enable RocketMQ processors
      # - kafka_processors    # 启用 Kafka 处理器 / Enable Kafka processors
      # - pulsar_processors   # 启用 Pulsar 处理器 / Enable Pulsar processors
      # - utility_processors  # 工具类处理器参考（一般不启用）/ Utility processor reference (usually disabled)
    assertion_generator:
      - foli_mall_assertion
    # 主流水线 Agent（按需取消注释） / Main pipeline agents (uncomment as needed)
    # requirement_analyzer: []
    # api_analyzer: []
    # plan_generator: []
    # plan_parser: []
    # case_generator:
    #   - boundary_test
    # skeleton_generator: []

# --- 日志持久化 / Log Persistence ---
logging:
  # 将日志写入 output_dir/logs/agent.log（默认关闭，按需开启）
  # Persist logs to output_dir/logs/agent.log (default off, enable on demand)
  log_to_output: false

# --- 界面语言 / UI Language ---
agent:
  # zh_CN = 简体中文，en_US = English
  lang: zh_CN
