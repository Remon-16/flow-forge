name: boundary_test
description: 为接口添加边界值测试能力，自动生成边界参数
version: "1.0"
target_agents:
  - case_generator
prompt_extension: |
  ## 边界值测试能力
  为每个数值型参数自动生成以下边界值用例：
  - 最小值 - 1（非法）
  - 最小值（合法）
  - 最大值（合法）
  - 最大值 + 1（非法）
  - 0 / 空字符串 / null
  为每个字符串参数自动生成：
  - 超长字符串（10000+ 字符）
  - 特殊字符注入（<script>、'; DROP TABLE--）
  - Unicode / emoji 字符
tools: []
