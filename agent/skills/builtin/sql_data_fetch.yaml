name: sql_data_fetch
description: 从数据库查询测试数据，用于填充用例参数
version: "1.0"
target_agents:
  - case_generator
prompt_extension: |
  ## SQL 数据获取能力
  你可以使用 execute_sql 工具从数据库中查询真实测试数据。
  当需要构造测试参数时，优先从数据库获取真实值，而非编造数据。
  查询时注意：
  - 使用参数化查询防止注入
  - 限制返回行数（默认 TOP 100）
  - 敏感字段（密码、手机号）使用脱敏数据
tools:
  - execute_sql
  - get_db_schema
