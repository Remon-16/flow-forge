# ============================================================================
# Flow Forge — 翻译智能体独立配置 / Case Translator Standalone Configuration
#
# 本配置文件与 env.yaml 完全独立，互不影响。
# This config file is COMPLETELY INDEPENDENT from env.yaml.
# 翻译智能体不会读取 env.yaml 的任何配置项。
# The translator does NOT read any settings from env.yaml.
#
# 使用方法 / Usage:
#   cp translate_env.example.yaml translate_env.yaml
#   编辑 translate_env.yaml 并填入配置 / Edit translate_env.yaml with your settings
# ============================================================================

llm:
  provider: openai           # LLM 提供商 / LLM provider
  api_key: ""                # API 密钥（必填）/ API key (required)
  model: gpt-4o              # 模型名称 / Model name (stronger model recommended for translation)
  temperature: 0.1           # 温度参数 / Temperature (low for consistent translation)
  max_output_tokens: 4096    # 最大输出 token / Max output tokens
  context_window: 128000     # 上下文窗口 / Context window size
  base_url: ""               # 第三方 API Base URL / Custom API base URL
  max_concurrency: 1         # 最大并发 / Max concurrency
  rate_limit_delay: 0.0      # 速率限制延迟（秒）/ Rate limit delay (seconds)
  retry_base_delay: 2.0      # 重试基础延迟（秒）/ Retry base delay (seconds)
  request_timeout: 600.0     # 请求超时（秒）/ Request timeout (seconds)
  extra_params: {}           # 额外 API 参数 / Extra API params (e.g. thinking mode)

translate:
  target_lang: zh_CN         # 目标语言: zh_CN | en_US / Target language
  batch_size: 10             # 每批最大用例数（-1 = 不分批）/ Max cases per batch (-1 = no batching)
  detection:                 # 已翻译检测 / Already-translated detection
    enabled: true            # 是否启用自动跳过已翻译用例 / Enable auto-skip for already-translated cases
    cjk_threshold: 0.5       # CJK 字符占比阈值 / Min CJK character ratio to consider a field "already translated"

# --- 日志设置 / Logging ---
logging:
  log_to_output: false       # 是否将日志持久化到输出目录 / Persist logs to output directory
